<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Connection Test</title>
  <style>
    body {
      font-family: monospace;
      padding: 2rem;
      background: #1a1a1a;
      color: #fff;
    }
    .log {
      background: #2a2a2a;
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 8px;
      max-height: 600px;
      overflow-y: auto;
    }
    .log div {
      margin: 0.5rem 0;
      padding: 0.5rem;
      border-left: 3px solid #666;
    }
    .success { border-color: #0f0; color: #0f0; }
    .error { border-color: #f00; color: #f00; }
    .info { border-color: #00f; color: #0af; }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      margin: 0.5rem;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h1>🧪 Supabase Connection Test</h1>
  <div>
    <button onclick="testConnection()">Test Connection</button>
    <button onclick="testProfileAccess()">Test Profile Access</button>
    <button onclick="clearLog()">Clear Log</button>
  </div>
  <div class="log" id="log"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://hcjkxiwmufabnztabbeb.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhjamt4aXdtdWZhYm56dGFiYmViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg5MzM5NjQsImV4cCI6MjA1NDUwOTk2NH0.REcD9tSc1OvzbWH9x8pOXQ_YWEJ7nI5'

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log')
      const entry = document.createElement('div')
      entry.className = type
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`
      logDiv.appendChild(entry)
      logDiv.scrollTop = logDiv.scrollHeight
      console.log(message)
    }

    function clearLog() {
      document.getElementById('log').innerHTML = ''
    }

    async function testConnection() {
      log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info')
      log('🧪 TEST 1: Basic Connection', 'info')
      log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info')
      
      try {
        log('📡 Teste ob Supabase erreichbar ist...', 'info')
        
        // Test 1: Health Check
        const response = await fetch(`${SUPABASE_URL}/rest/v1/`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY
          }
        })
        
        if (response.ok) {
          log('✅ Supabase ist erreichbar!', 'success')
        } else {
          log(`❌ Supabase antwortet mit Status: ${response.status}`, 'error')
        }

        // Test 2: Auth Session
        log('📡 Prüfe Auth Session...', 'info')
        const { data: sessionData, error: sessionError } = await supabase.auth.getSession()
        
        if (sessionError) {
          log(`❌ Session Error: ${sessionError.message}`, 'error')
        } else if (sessionData.session) {
          log(`✅ User eingeloggt: ${sessionData.session.user.id}`, 'success')
          log(`   Email: ${sessionData.session.user.email}`, 'info')
        } else {
          log('⚠️ Kein User eingeloggt', 'error')
        }

      } catch (error) {
        log(`💥 Connection Error: ${error.message}`, 'error')
      }
    }

    async function testProfileAccess() {
      log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info')
      log('🧪 TEST 2: Profile Table Access', 'info')
      log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info')

      try {
        // Test ohne Filter (alle profiles)
        log('📡 Query: SELECT * FROM profiles (ohne Filter)', 'info')
        log('⏰ Starte Query mit 15s Timeout...', 'info')
        
        const controller = new AbortController()
        const timeoutId = setTimeout(() => {
          controller.abort()
          log('⏰ TIMEOUT nach 15 Sekunden!', 'error')
          log('→ Query hängt! RLS Policy blockiert wahrscheinlich', 'error')
        }, 15000)

        const { data, error } = await supabase
          .from('profiles')
          .select('*')
          .abortSignal(controller.signal)

        clearTimeout(timeoutId)

        if (error) {
          log(`❌ Query Error: ${error.message}`, 'error')
          log(`   Code: ${error.code}`, 'error')
          log(`   Details: ${error.details}`, 'error')
          log(`   Hint: ${error.hint}`, 'error')
          
          if (error.code === '42501') {
            log('→ PERMISSION DENIED! RLS Policy blockiert!', 'error')
            log('→ Führe 03-policies.sql aus!', 'error')
          }
        } else {
          log(`✅ Query erfolgreich!`, 'success')
          log(`   Gefunden: ${data.length} Profile(s)`, 'success')
          if (data.length > 0) {
            data.forEach(profile => {
              log(`   - ${profile.username} (${profile.role}, ID: ${profile.id})`, 'info')
            })
          }
        }

        // Test mit spezifischem User
        const { data: sessionData } = await supabase.auth.getSession()
        if (sessionData.session) {
          log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info')
          log('📡 Query: SELECT * FROM profiles WHERE id = auth.uid()', 'info')
          
          const { data: myProfile, error: myError } = await supabase
            .from('profiles')
            .select('*')
            .eq('id', sessionData.session.user.id)
            .single()

          if (myError) {
            log(`❌ Mein Profile Error: ${myError.message}`, 'error')
            log(`   Code: ${myError.code}`, 'error')
            
            if (myError.code === 'PGRST116') {
              log('→ KEIN PROFILE GEFUNDEN für diesen User!', 'error')
              log('→ Trigger hat nicht funktioniert!', 'error')
            }
          } else {
            log(`✅ Mein Profile gefunden!`, 'success')
            log(`   Username: ${myProfile.username}`, 'info')
            log(`   Role: ${myProfile.role}`, 'info')
            log(`   Level: ${myProfile.level}`, 'info')
            log(`   Points: ${myProfile.points}`, 'info')
          }
        }

      } catch (error) {
        if (error.name === 'AbortError') {
          log('⏰ Query wurde abgebrochen (Timeout)', 'error')
        } else {
          log(`💥 Unerwarteter Fehler: ${error.message}`, 'error')
        }
      }
    }

    // Auto-run on load
    window.addEventListener('load', () => {
      log('🚀 Supabase Connection Tester geladen', 'info')
      log('Klick auf "Test Connection" zum Starten', 'info')
    })
  </script>
</body>
</html>
